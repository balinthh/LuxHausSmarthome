<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>LuxHaus - Kapcsolat</title>
</head>

<body>
    <header class="mt-3">
        <video class="background-video" autoplay muted loop playsinline>
            <source src="img/stocktech.mp4" type="video/mp4">
        </video>
        <nav>
        <div class="container">
            <div class="row">
                <div class="col-lg-3 text-center text-lg-start">
                    <a href="index.html"><img src="img/image.png" alt="LuxHaus Logo" title="Logo" class="w-50"></a>
                </div>
                <div class="col-lg-9">
                        <ul class="d-flex mt-4 fs-5 justify-content-end">
                            <li class="ms-5"><a href="eszkozok.html">Termékek</a></li>
                            <li class="ms-5"><a href="kapcsolat.html">Kapcsolat</a></li>
                            <li class="ms-5"><a href="profile.html" class="nav-profil"><i class="bi bi-person"></i></a></li>
                        </ul>
                </div>
            </div>
        </div>
        </nav>
    </header>
    <main class="pt-5">
        <section>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-4 mb-4">
                        <div class="panel h-100">
                            <h3 class="mb-4"><i class="bi bi-geo-alt"></i> Elérhetőség</h3>
                            <p><i class="bi bi-envelope me-2"></i> info@luxhaus.hu</p>
                            <p><i class="bi bi-telephone me-2"></i> +36 1 234 5678</p>
                            <p><i class="bi bi-building me-2"></i> 1051 Budapest, Okos utca 1.</p>
                            <p class="mb-0"><i class="bi bi-clock me-2"></i> H–P: 9:00 – 17:00</p>
                        </div>
                    </div>
                    <div class="col-lg-6 mb-4">
                        <div class="panel">
                            <h3 class="mb-4"><i class="bi bi-chat-dots"></i> Írj nekünk</h3>
                            <p class="uzenet"></p>
                            <div class="mb-3">
                                <label class="form-label">Név</label>
                                <input type="text" class="form-control kapcsolat-nev">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control kapcsolat-email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Üzenet</label>
                                <textarea class="form-control kapcsolat-uzenet" rows="4"></textarea>
                            </div>
                            <button type="button" class="gomb" onclick="uzenetKuld()">Küldés</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container text-center">LuxHaus SmartHome &middot; az adatok a böngésződben (localStorage) tárolódnak</div>
    </footer>
</body>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/profil.js"></script>
<script src="js/eszkoz.js"></script>
<script src="js/tarolo.js"></script>
<script src="js/script.js"></script>
<script src="js/kapcsolat.js"></script>
</html>
